# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    categories_directory: '%kernel.project_dir%/public/images/categories'
    etablissement_directory: '%kernel.project_dir%/public/images/etablissement'
    uploads_directory: '%kernel.project_dir%/public/uploads'
    chaines_directory: '%kernel.project_dir%/public/images/chaines'
    radio_directory: '%kernel.project_dir%/public/images/radio'
    categorie_radio_directory: '%kernel.project_dir%/public/images/categorie_radio'
    application_directory: '%kernel.project_dir%/public/images/application'
    jeux_directory: '%kernel.project_dir%/public/images/jeux'
    categorie_livreaudio_directory: '%kernel.project_dir%/public/images/categorie_livreaudio'
    livreaudio_directory: '%kernel.project_dir%/public/images/livreaudio'
    charte_patient_directory: '%kernel.project_dir%/public/pdf/charte_patient'
    service_payant_directory: '%kernel.project_dir%/public/pdf/service_payant'
    service_in_room_directory: '%kernel.project_dir%/public/serviceinroom'
    annonce_directory: '%kernel.project_dir%/public/annonce'
    vod_directory: '%kernel.project_dir%/public/images/vod'
    categorie_vod_directory: '%kernel.project_dir%/public/images/categorie_vod'
    smtp_username: '%env(SMTP_USERNAME)%'
    smtp_password: '%env(SMTP_PASSWORD)%'
    smtp_host: '%env(SMTP_HOST)%' 
    smtp_port: '%env(SMTP_PORT)%' 
    


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\Consumer\MyConsumer:
        autowire: true

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
